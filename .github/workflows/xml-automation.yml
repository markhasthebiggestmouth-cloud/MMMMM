name: Process XML File

on:
  push:
    paths:
      - 'data.xml'

jobs:
  run-xml-parser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install XML parser library
        run: npm install fast-xml-parser

      - name: Run script to read XML
        run: node parse-xml.js
